<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Rounded Base Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  
  <!-- Inner Glow Ring -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4" />
  
  <g filter="url(#shadow)">
    <!-- Graduation Cap Diamond -->
    <path d="M256 120 L408 196 L256 272 L104 196 Z" fill="url(#accent)" />
    <!-- Graduation Cap Under-Brim -->
    <path d="M168 234 V296 C168 332 208 356 256 356 C304 356 344 332 344 296 V234 L256 278 Z" fill="#ffffff" fill-opacity="0.95" />
    <!-- Tassel String & Bob -->
    <path d="M370 215 C370 240 376 270 380 290" fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round" />
    <circle cx="380" cy="298" r="10" fill="url(#gold)" />
    
    <!-- Sparkle Stars / Recommendation Node Target -->
    <circle cx="256" cy="392" r="14" fill="url(#gold)" />
    <circle cx="256" cy="392" r="32" fill="none" stroke="url(#gold)" stroke-width="4" stroke-dasharray="8 6" opacity="0.8" />
  </g>
</svg>
